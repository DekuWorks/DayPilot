# Build Next.js static export and deploy with GitHub Actions.
# Repo Settings → Pages: Source MUST be "GitHub Actions".
# Do NOT use "Deploy from a branch" /docs — that publishes markdown docs without
# index.html and races this workflow, causing intermittent GitHub Pages 404s.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build web app
        run: pnpm run build --filter @daypilot/web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.daypilot.co' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://daypilot.co' }}

      - name: Setup Pages output
        run: |
          if [ ! -f apps/web/out/index.html ]; then
            echo "::error::Static export missing apps/web/out/index.html — refusing to deploy (would 404 on GitHub Pages)."
            ls -la apps/web/out || true
            exit 1
          fi
          if [ -f CNAME ]; then
            cp CNAME apps/web/out/CNAME
          fi
          touch apps/web/out/.nojekyll
          # Ensure SPA-style deep-link fallback for /book/* and /tasks/* is present
          if [ ! -f apps/web/out/404.html ] && [ -f apps/web/public/404.html ]; then
            cp apps/web/public/404.html apps/web/out/404.html
          fi
          echo "Pages artifact ready:"
          ls -la apps/web/out/index.html apps/web/out/CNAME apps/web/out/.nojekyll apps/web/out/404.html 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
