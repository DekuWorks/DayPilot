# Build and push API Docker image to GitHub Container Registry (GHCR).
# Usage: Push to main; image is ghcr.io/OWNER/daypilot-api:latest.
#
# Optional Fly deploy: set repo secret FLY_API_TOKEN (fly tokens create).
# Requires a paid / unsuspended Fly account — see docs/PRODUCTION_API_SETUP.md.
# Hosting still needs DNS for api.daypilot.co and secrets on the Fly app.

name: Deploy API (build + push)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FLY_APP: daypilot-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/daypilot-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-fly:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Detect Fly token
        id: fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "FLY_API_TOKEN not set — skipping Fly deploy (image still in GHCR). See docs/PRODUCTION_API_SETUP.md"
          fi

      - uses: actions/checkout@v4
        if: steps.fly.outputs.enabled == 'true'

      - name: Setup flyctl
        if: steps.fly.outputs.enabled == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: steps.fly.outputs.enabled == 'true'
        working-directory: apps/api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only -a ${{ env.FLY_APP }}
