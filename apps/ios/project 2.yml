name: DayPilot
options:
  bundleIdPrefix: com.dekuworks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
packages:
  DayPilotCore:
    path: .
configs:
  Debug: debug
  Release: release
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: 1
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  DayPilot:
    type: application
    platform: iOS
    sources:
      - path: App/DayPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dekuworks.daypilot.swift
        PRODUCT_NAME: DayPilot
        INFOPLIST_FILE: App/DayPilot/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPABASE_URL: https://wmkytyrcxbzjqiykbauw.supabase.co
        DAYPILOT_API_URL: https://api-production-6c2c.up.railway.app
        SUPABASE_ANON_KEY: ""
    dependencies:
      - package: DayPilotCore
        product: DayPilotCore
      - sdk: EventKit.framework
      - sdk: AuthenticationServices.framework
  DayPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/DayPilotCoreTests
    dependencies:
      - target: DayPilot
      - package: DayPilotCore
        product: DayPilotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dekuworks.daypilot.swift.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DayPilot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DayPilot"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DayPilot:
    build:
      targets:
        DayPilot: all
        DayPilotTests: [test]
    test:
      targets:
        - DayPilotTests
