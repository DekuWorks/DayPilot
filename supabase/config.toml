# DayPilot Supabase project (remote: wmkytyrcxbzjqiykbauw)
# Apply migrations: supabase link && supabase db push
# Push Auth/API settings: supabase config push --project-ref wmkytyrcxbzjqiykbauw --yes

project_id = "wmkytyrcxbzjqiykbauw"

[db]
major_version = 17

[auth]
enabled = true
# Production site URL (restore after accidental localhost push)
site_url = "https://www.daypilot.co"
additional_redirect_urls = [
  "https://www.daypilot.co/**",
  "https://daypilot.co/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback",
  "https://www.daypilot.co/auth/callback",
  "https://daypilot.co/auth/callback",
  # Flutter iOS / Android OAuth deep link (PKCE)
  "com.daypilot.daypilot://login-callback/",
  "com.daypilot.daypilot://login-callback",
]
enable_signup = true

[auth.email]
enable_signup = true
# Production currently requires email confirmation
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# Google social login (SSO for web + mobile).
# Set SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID / SECRET in the environment
# before `supabase config push`, or run scripts/configure-google-auth.sh
# (Dashboard: Authentication → Providers → Google).
# Keep enabled=false until secrets are present, then:
#   export SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID=...
#   export SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET=...
#   # flip enabled to true below and run: ./scripts/configure-google-auth.sh
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Apple Sign in with Apple (SSO for web + mobile OAuth).
# Set SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID / SECRET before `supabase config push`,
# or run scripts/configure-apple-auth.sh (Dashboard: Authentication → Providers → Apple).
# Client ID should list Services ID first, then iOS bundle ID:
#   com.daypilot.daypilot.web,com.daypilot.daypilot
# Secret is a JWT minted from Team ID + Key ID + .p8 (expires ~6 months).
# Keep enabled=false until secrets are present.
[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
skip_nonce_check = false

# Microsoft / Azure SSO (Outlook). See docs/OUTLOOK_AUTH_SETUP.md.
# Secrets live in SUPABASE_AUTH_EXTERNAL_AZURE_* (not committed).
[auth.external.azure]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_AZURE_SECRET)"
url = "https://login.microsoftonline.com/common"
skip_nonce_check = false
